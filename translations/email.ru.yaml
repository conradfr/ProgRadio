general:
    hello: Здравствуйте,
    sponsor: "<a href=\"https://stream-checker.radio-addict.com\">Stream Checker</a>: отслеживайте свои потоки и мгновенно получайте уведомления о сбоях."

signature:
    regards: С уважением,

signup:
    subject: '%name% - Регистрация'
    welcome: Добро пожаловать!
    text_1: Теперь вы зарегистрированы на %link%
    text2: Если у вас были избранные радиостанции или потоки, теперь они сохранены в вашем аккаунте.

reset:
    subject: '%name% - Сброс пароля'
    header: Сброс пароля
    text_1: На %url% был запрошен сброс пароля
    text_2: "Чтобы изменить пароль, перейдите по этой ссылке (действительна 24 часа): %link%"
    text_3: Если вы не отправляли этот запрос, просто проигнорируйте это письмо.

email_change:
    subject: "%name% - Изменение адреса email"
    header: Изменение адреса email
    text_1: На %url% был запрошен переход на email %new_email%.
    text_2: Поэтому вы больше не можете входить с логином %old_email%.
    text_3: "Если это сделали не вы, вы можете отменить изменение, перейдя по этой ссылке (действительна 24 часа): %link%"
    text_4: Мы также рекомендуем сменить пароль.

password_update:
    subject: '%name% - Изменение пароля'
    header: Изменение пароля
    text_1: Пароль аккаунта, связанного с этим адресом, был изменён на %url%
    text_2: "Если это сделали не вы, вы можете отменить изменение и задать новый пароль, перейдя по этой ссылке (действительна 24 часа): %link%"

stream_stats:
    subject: Статистика ваших радиостанций
    top_1: "Здравствуйте, %user_email%"
    top_2: "Вот статистика ваших радиостанций за прошлый месяц:"
    disable: "Вы можете отписаться от этой рассылки на странице \"Мои радиостанции\" в вашем аккаунте."
    stat: "<strong>%name%</strong>: сеансов прослушивания: %sessions%, общее время: %time%"
