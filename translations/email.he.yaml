general:
    hello: שלום,
    sponsor: "<a href=\"https://stream-checker.radio-addict.com\">Stream Checker</a>: עקבו אחר השידורים שלכם וקבלו התראה מיידית במקרה של תקלה."

signature:
    regards: בברכה,

signup:
    subject: '%name% - הרשמה'
    welcome: ברוכים הבאים!
    text_1: נרשמתם בהצלחה ל-%link%
    text2: אם היו לכם תחנות רדיו או שידורים מועדפים, הם שמורים כעת בחשבון שלכם.

reset:
    subject: '%name% - איפוס סיסמה'
    header: איפוס סיסמה
    text_1: התקבלה בקשה לאיפוס סיסמה באתר %url%
    text_2: "כדי לעדכן את הסיסמה, לחצו על הקישור הזה (בתוקף 24 שעות): %link%"
    text_3: אם לא ביקשתם זאת, ניתן להתעלם מהודעה זו.

email_change:
    subject: "%name% - שינוי כתובת אימייל"
    header: שינוי כתובת אימייל
    text_1: התקבלה בקשה לשינוי האימייל ל-%new_email% באתר %url%.
    text_2: לכן לא תוכלו עוד להתחבר עם שם המשתמש %old_email%.
    text_3: "אם לא אתם ביצעתם את השינוי, ניתן לבטל אותו בלחיצה על הקישור הזה (בתוקף 24 שעות): %link%"
    text_4: אנו ממליצים גם לשנות את הסיסמה שלכם.

password_update:
    subject: '%name% - שינוי סיסמה'
    header: שינוי סיסמה
    text_1: הסיסמה של החשבון המקושר לכתובת זו שונתה באתר %url%
    text_2: "אם לא אתם ביצעתם את השינוי, ניתן לבטל אותו ולבחור סיסמה חדשה בלחיצה על הקישור הזה (בתוקף 24 שעות): %link%"

stream_stats:
    subject: הסטטיסטיקות של תחנות הרדיו שלכם
    top_1: "שלום, %user_email%"
    top_2: "אלה הסטטיסטיקות של תחנות הרדיו שלכם בחודש שעבר:"
    disable: "ניתן לבטל את המינוי לאימייל זה בדף \"תחנות הרדיו שלי\" בחשבון שלכם."
    stat: "<strong>%name%</strong>: %sessions% האזנות בזמן כולל של %time%"
