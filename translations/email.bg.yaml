general:
    hello: Здравейте,
    sponsor: "<a href=\"https://stream-checker.radio-addict.com\">Stream Checker</a>: наблюдавайте потоците си и получавайте незабавно известие при прекъсване."

signature:
    regards: Поздрави,

signup:
    subject: '%name% - Регистрация'
    welcome: Добре дошли!
    text_1: Вече сте регистрирани в %link%
    text2: Ако сте имали любими радиостанции или потоци, те вече са запазени в профила ви.

reset:
    subject: '%name% - Нулиране на паролата'
    header: Нулиране на паролата
    text_1: Получена е заявка за нулиране на паролата в %url%
    text_2: "За да обновите паролата си, натиснете този линк (валиден 24 часа): %link%"
    text_3: Ако не сте направили тази заявка, можете да игнорирате този имейл.

email_change:
    subject: "%name% - Промяна на имейл адреса"
    header: Промяна на имейл адреса
    text_1: Получена е заявка за промяна на имейла на %new_email% в %url%.
    text_2: Поради това вече не можете да влизате с потребителското име %old_email%.
    text_3: "Ако не сте направили тази промяна, можете да я отмените, като натиснете този линк (валиден 24 часа): %link%"
    text_4: Препоръчваме ви също да смените паролата си.

password_update:
    subject: '%name% - Промяна на паролата'
    header: Промяна на паролата
    text_1: Паролата на профила, свързан с този адрес, беше променена в %url%
    text_2: "Ако не сте направили тази промяна, можете да я отмените и да изберете нова парола, като натиснете този линк (валиден 24 часа): %link%"

stream_stats:
    subject: Статистика на вашите радиостанции
    top_1: "Здравейте, %user_email%"
    top_2: "Ето статистиката на вашите радиостанции за предходния месец:"
    disable: "Можете да се отпишете от този имейл на страницата \"Моите радиостанции\" във вашия профил."
    stat: "<strong>%name%</strong>: %sessions% сесии на слушане с обща продължителност %time%"
